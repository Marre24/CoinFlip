<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />

    <title>Coin Flip</title>
  </head>

  <body>
    <p id="moneyLabel">$0</p>
    <button id="shopIcon" aria-label="Shop">🛒</button>

    <dialog id="shopModal">
      <h2>Shop</h2>

      <div id="shopGrid">
        <div class="shopItem">
          <img src="assets/img/SilverCoinHeads.png" alt="Silver Skin" />
          <p class="itemLabel">Silver</p>
        </div>

        <div class="shopItem">
          <img src="assets/img/GoldCoinHeads.png" alt="Gold Skin" />
          <p class="itemLabel">Gold</p>
        </div>
      </div>

      <button id="closeShop">Close</button>
    </dialog>

    <div id="gameWrapper">
      <div id="streakDisplay">
        <p id="currentStreak">Current Streak: 0</p>
        <p id="maxStreak">Max Streak: 0</p>
      </div>

      <div id="gameArea">
        <div id="coinZone">
          <div id="coinColumn">
            <div id="coinWrapper">
              <img
                id="coinImage"
                src="assets/img/BronzeCoinHeads.png"
                alt="Coin"
              />
            </div>

            <button id="flipButton">Flip Coin</button>
          </div>
        </div>

        <div id="listZone">
          <ul id="historyList"></ul>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
